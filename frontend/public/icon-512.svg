<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#070C18"/>
      <stop offset="100%" stop-color="#002147"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>
  <!-- Crossed Gavel & Cricket Bat Silhouette -->
  <g transform="translate(256, 256)">
    <!-- Cricket Ball -->
    <circle cx="0" cy="-60" r="48" fill="#EF4444" stroke="#DC2626" stroke-width="4"/>
    <path d="M -30 -60 Q 0 -90 30 -60" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="6,4"/>
    <path d="M -30 -60 Q 0 -30 30 -60" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="6,4"/>
    <!-- Gavel Head -->
    <rect x="-85" y="10" width="170" height="60" rx="12" fill="url(#gold)" transform="rotate(-25)"/>
    <!-- Gavel Handle -->
    <rect x="-12" y="55" width="24" height="150" rx="10" fill="url(#blue)" transform="rotate(-25)"/>
  </g>
</svg>
